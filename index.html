<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Luarix — Protect & Monetize your code</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #050505; --bg-card: rgba(15, 15, 20, 0.7); --border: rgba(255, 255, 255, 0.08);
    --text: #ffffff; --text-muted: #888; --gold: #f5c518; 
    --gold-grad: linear-gradient(135deg, #f5c518, #d4a017); 
    --success: #10b981; --danger: #ef4444;
    --glow: 0 0 20px rgba(245, 197, 24, 0.2);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden;
    background-image: radial-gradient(circle at 15% 50%, rgba(245, 197, 24, 0.08), transparent 25%),
                      radial-gradient(circle at 85% 30%, rgba(239, 68, 68, 0.05), transparent 25%);
  }

  /* NAVBAR */
  nav {
    position: fixed; top: 1rem; left: 50%; transform: translateX(-50%);
    width: calc(100% - 2rem); max-width: 1100px; display: flex; align-items: center; justify-content: space-between;
    padding: 0.8rem 1.5rem; background: rgba(10, 10, 12, 0.8); backdrop-filter: blur(20px);
    border: 1px solid var(--border); border-radius: 12px; z-index: 100;
  }
  .nav-brand { font-size: 1.4rem; font-weight: 800; color: var(--gold); letter-spacing: -0.5px; cursor: pointer;}
  nav .links { display: flex; gap: 1.8rem; }
  nav a { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: 0.2s; }
  nav a:hover { color: var(--text); }
  .btn-gold { background: var(--gold-grad); color: #000; padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 700; border: none; cursor: pointer; transition: 0.2s; }
  .btn-gold:hover { transform: translateY(-2px); box-shadow: var(--glow); }

  /* DASHBOARD */
  #view-dashboard { display: none; height: 100vh; width: 100vw; background: var(--bg); }
  .dash-layout { display: flex; height: 100%; }
  .sidebar { width: 260px; background: rgba(10, 10, 12, 0.95); border-right: 1px solid var(--border); padding: 1.5rem; display: flex; flex-direction: column; }
  .sidebar h2 { color: var(--gold); margin-bottom: 2rem; font-size: 1.2rem; }
  .menu-item { padding: 0.8rem 1rem; border-radius: 8px; color: var(--text-muted); cursor: pointer; margin-bottom: 0.5rem; transition: 0.2s; font-weight: 500;}
  .menu-item:hover, .menu-item.active { background: rgba(245, 197, 24, 0.1); color: var(--gold); }
  .main-content { flex: 1; padding: 2rem; display: flex; flex-direction: column; align-items: center; overflow-y: auto; }
  .panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; width: 100%; max-width: 850px; backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  
  .form-group { margin-bottom: 1.5rem; }
  label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;}
  textarea { width: 100%; padding: 1rem; background: #000; border: 1px solid var(--border); border-radius: 8px; color: #a5f3c4; font-family: monospace; min-height: 250px; resize: vertical; transition: 0.2s;}
  textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 10px rgba(245, 197, 24, 0.1); }
  
  .btn-primary { background: var(--gold-grad); color: #000; padding: 1rem; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; width: 100%; font-size: 1rem; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px;}
  .btn-primary:hover { transform: translateY(-2px); box-shadow: var(--glow); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  
  /* OUTPUT BOX */
  .output-box { display: none; margin-top: 2rem; background: #000; border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; }
  .output-box.show { display: block; }
  .output-box h3 { color: var(--success); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
  
  textarea#loader-code { 
    width: 100%; height: 100px; background: #0a0a0a; color: var(--gold); 
    border: 1px solid var(--border); border-radius: 8px; padding: 10px; 
    font-family: monospace; font-size: 0.85rem; resize: none; margin-bottom: 1rem; 
  }

  .btn-group { display: flex; gap: 1rem; margin-top: 1rem;}
  .btn-secondary { background: rgba(255,255,255,0.05); color: var(--text); padding: 1rem; border: 1px solid var(--border); border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; transition: 0.2s; }
  .btn-secondary:hover { background: rgba(255,255,255,0.1); border-color: var(--gold); color: var(--gold); }
</style>
</head>
<body>

<nav id="main-nav">
  <a class="nav-brand" onclick="showView('landing')">Luarix</a>
  <div class="links">
    <a onclick="document.getElementById('admin-modal').classList.add('show')" style="color: var(--gold);">Admin Access</a>
  </div>
</nav>

<div id="view-dashboard">
  <div class="dash-layout">
    <div class="sidebar">
      <h2>Luarix Panel</h2>
      <div class="menu-item active">🛡️ Script Protector</div>
      <div class="menu-item" style="margin-top: auto; color: var(--danger);" onclick="logout()">🚪 Logout</div>
    </div>
    <div class="main-content">
      <div class="panel">
        <h2 style="margin-bottom: 1.5rem; font-size: 1.5rem;">Protect Script</h2>
        <div class="form-group">
          <label>Lua Source Code</label>
          <textarea id="lua-source" placeholder="-- Paste your script here..."></textarea>
        </div>
        <button class="btn-primary" id="protect-btn" onclick="doObfuscate()">⚡ Obfuscate & Generate Loader</button>
        
        <div class="output-box" id="output">
          <h3 id="status-title">✓ Protected Successfully!</h3>
          <label>Loader (Copy & Execute)</label>
          <textarea id="loader-code" readonly></textarea>
          
          <div class="btn-group">
            <button class="btn-secondary" onclick="copyText()">📋 Copy Loader</button>
            <button class="btn-secondary" onclick="downloadLua()">⬇️ Download .lua</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODALS (Simplified for space) -->
<div class="modal-bg" id="admin-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); align-items:center; justify-content:center;">
  <div style="background:#111; padding:2rem; border-radius:12px; text-align:center;">
    <h2>Admin Access</h2>
    <input type="password" id="admin-pass" placeholder="Password" style="padding:1rem; margin:1rem 0; width:100%; background:#000; color:#fff; border:1px solid #333;">
    <button class="btn-gold" onclick="login('admin')">Unlock</button>
  </div>
</div>

<script>
/* ============================================================
   1. SYNCHRONOUS OBFUSCATOR (UTF-8 Safe)
   ============================================================ */
function encryptLua(source) {
    const key = Math.floor(Math.random() * 200) + 10;
    const bytes = new TextEncoder().encode(source);
    const hexArr = new Array(bytes.length);
    
    for (let i = 0; i < bytes.length; i++) {
        hexArr[i] = (bytes[i] ^ key).toString(16).padStart(2, '0');
    }
    const hexString = hexArr.join('');

    return `
-- Luarix Protected
local h = "${hexString}"
local k = ${key}
local s = h:gsub("%x%x", function(c) 
    return string.char(bit32.bxor(tonumber(c, 16), k)) 
end)
loadstring(s)()
`.trim();
}

/* ============================================================
   2. UPLOAD TO PASTES (Behind the scenes)
   ============================================================ */
async function uploadToHost(obfuscatedCode) {
    try {
        const response = await fetch("https://api.pastes.dev/post", {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: obfuscatedCode
        });
        if (!response.ok) return null;
        const data = await response.json();
        return data.key; // Return just the key (e.g., "lFfpSHRFUK")
    } catch (err) {
        return null;
    }
}

/* ============================================================
   3. UI LOGIC
   ============================================================ */
function login() {
    if (document.getElementById('admin-pass').value !== 'cubic%is' + '@luarix' + '^owner') return alert("Incorrect");
    document.getElementById('admin-modal').style.display = 'none';
    document.getElementById('view-dashboard').style.display = 'block';
}
function logout() { document.getElementById('view-dashboard').style.display = 'none'; }

let currentLoaderUrl = "";
let currentObfuscatedCode = "";

async function doObfuscate() {
    const source = document.getElementById('lua-source').value.trim();
    if (!source) return alert("Paste a script first!");

    const btn = document.getElementById('protect-btn');
    const output = document.getElementById('output');
    const loaderCode = document.getElementById('loader-code');
    const statusTitle = document.getElementById('status-title');

    // Show UI immediately so user knows it's working
    btn.disabled = true;
    btn.textContent = "⏳ Encrypting...";
    output.classList.add('show');
    statusTitle.textContent = "Encrypting...";
    loaderCode.value = "Please wait...";

    // Delay to allow UI to paint before freezing for encryption
    await new Promise(r => setTimeout(r, 50));

    try {
        // 1. Encrypt
        const encrypted = encryptLua(source);
        currentObfuscatedCode = encrypted;
        statusTitle.textContent = "Uploading to Luarix Servers...";
        btn.textContent = "⏳ Uploading...";

        // 2. Upload to Pastes to get key
        const key = await uploadToHost(encrypted);

        if (key) {
            // THE MAGIC: We use YOUR Vercel domain here!
            const customUrl = `https://${window.location.host}/api/raw?key=${key}`;
            currentLoaderUrl = `loadstring(game:HttpGet("${customUrl}"))()`;
            statusTitle.textContent = "✓ Protected (HttpGet Loader)";
        } else {
            // Fallback if pastes.dev is down
            currentLoaderUrl = `loadstring([==[\n${encrypted}\n]==])()`;
            statusTitle.textContent = "✓ Protected (Inline Loader)";
        }

        // 3. Display safely
        loaderCode.value = currentLoaderUrl;
        setTimeout(() => output.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);

    } catch (err) {
        alert("Error: " + err.message);
    } finally {
        btn.disabled = false;
        btn.textContent = "⚡ OBFUSCATE & GENERATE LOADER";
    }
}

function copyText() {
    const loaderCode = document.getElementById('loader-code');
    loaderCode.select();
    navigator.clipboard.writeText(loaderCode.value);
    alert("Loader copied!");
}

function downloadLua() {
    if (!currentObfuscatedCode) return;
    const blob = new Blob([currentObfuscatedCode], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "luarix_protected.lua";
    a.click();
}
</script>
</body>
</html>
